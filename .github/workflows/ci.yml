name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HARNAS_SPEC: ${{ github.workspace }}/harnas-spec

jobs:
  node:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:conformance:node
      - run: npm run test:conformance:packed

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci
      - run: npm run test:conformance:bun

  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run test:conformance:deno

  roundtrip:
    name: Cross-language round trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas harnas-spec
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas-go ../harnas-go
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas-ruby ../harnas-ruby
      - run: git clone -c core.autocrlf=false --depth 1 https://github.com/Tedo-ai/harnas-python ../harnas-python

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ../harnas-ruby

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run test:conformance:roundtrip
