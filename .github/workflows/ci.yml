name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 --branch v0.19.0 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:conformance:node
        env:
          HARNAS_SPEC: ${{ github.workspace }}/harnas-spec
      - run: npm run test:conformance:packed

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 --branch v0.19.0 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci
      - run: npm run test:conformance:bun
        env:
          HARNAS_SPEC: ${{ github.workspace }}/harnas-spec

  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -c core.autocrlf=false --depth 1 --branch v0.19.0 https://github.com/Tedo-ai/harnas harnas-spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run test:conformance:deno
        env:
          HARNAS_SPEC: ${{ github.workspace }}/harnas-spec
